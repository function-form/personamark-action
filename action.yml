name: PersonaMark audit
description: Audit your site's SEO after a deploy and report what changed since the audit before.
author: function-form
branding:
  icon: activity
  color: blue

inputs:
  api-key:
    description: A PersonaMark API key for the site (Settings › API). Pass it from a secret.
    required: true
  base-url:
    description: Where PersonaMark is.
    default: https://work.personamark.app
  preview-url:
    description: >-
      A pull request's preview deployment to audit and compare with production, instead of auditing
      the site. It must be on one of the site's preview hosts (Settings › Crawling).
    default: ""
  ref:
    description: The branch, to label a preview audit. Defaults to the pull request's head branch.
    default: ""
  pull-request:
    description: The pull request's number, to label a preview audit.
    default: ""
  personas:
    description: >-
      With preview-url, persona and goal pairs to run on the preview and compare with their last
      runs on production, as <persona-id>:<goal-id>, one a line (ids from GET /api/v1/personas). At
      most 5; each run costs model calls.
    default: ""
  wait:
    description: Wait for the audit to finish and report on it. With false, the step only starts it.
    default: "true"
  timeout-minutes:
    description: How long to wait for the audit before giving up on it. The audit itself carries on.
    default: "30"
  comment:
    description: >-
      Post the summary as a comment on the pull request the deployed commit came from, or on the
      commit when there's none. A re-run updates its own pull request comment.
    default: "true"
  github-token:
    description: The token to comment with. Needs `pull-requests: write` (and `contents: write` for commit comments).
    default: ${{ github.token }}
  fail-on:
    description: >-
      When to fail the step: `none`, `new-high` (an issue of high severity is new or back),
      `score-drop:<n>` (the score fell by n or more), `run-failed` (a persona didn't reach its goal on
      the preview, though it does on production) or `run-score-drop:<n>` (a persona's score fell by n
      or more against production's). Several, comma-separated.
    default: none

outputs:
  job-id:
    description: The audit job's id.
  preview-id:
    description: The preview audit's id, with preview-url.
  audit-id:
    description: The audit's id, once it finished.
  audit-url:
    description: The audit in PersonaMark, or with preview-url the production audit it was compared with.
  score:
    description: The audit's score, 0 to 100.
  score-change:
    description: The change since the audit before, empty when the two can't be compared.
  new-high:
    description: How many issues of high severity are new or back.
  runs:
    description: >-
      With personas, each run as JSON: personaId, goalId, previewRunId, status, outcome, score and
      scoreChange.

runs:
  using: node24
  main: dist/index.js
